; GPSDO status display for the ESP32-2432S028R "Cheap Yellow Display".
; env:native runs the parser unit tests on the build host: pio test -e native

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -DCAPTURE_DIR=\"${PROJECT_DIR}/captures\"
