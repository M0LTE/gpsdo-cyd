; GPSDO status display for the ESP32-2432S028R "Cheap Yellow Display".
;   pio test -e native        parser and monitor unit tests on the build host
;   pio run -e sim            PC simulator that renders the screens to images (see tools/render.sh)
;   pio run -e cyd -t upload  firmware for the single-USB CYD (ILI9341)
;   pio run -e cyd2usb        firmware for the two-USB CYD (ST7789)

[platformio]
default_envs = native

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra -DLV_CONF_INCLUDE_SIMPLE -I include

[env:native]
platform = native
test_framework = unity
lib_ignore = gpsdo_ui
build_src_filter = -<*>
build_flags = ${env.build_flags} -DCAPTURE_DIR=\"${PROJECT_DIR}/captures\"

[env:sim]
platform = native
lib_deps = lvgl/lvgl@~9.2.2
build_src_filter = -<*> +<sim/>
build_flags = ${env.build_flags} -Wno-unused-parameter -Wno-missing-field-initializers

[cyd_common]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
lib_deps =
  lvgl/lvgl@~9.2.2
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
  knolleary/PubSubClient@^2.8
build_src_filter = -<*> +<device/>
build_flags =
  ${env.build_flags}
  -I src/device
  -D USER_SETUP_LOADED=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000

; Single-USB board (micro USB only): ILI9341
[env:cyd]
extends = cyd_common
build_flags =
  ${cyd_common.build_flags}
  -D ILI9341_2_DRIVER=1

; Two-USB board (micro USB and USB-C): ST7789
[env:cyd2usb]
extends = cyd_common
build_flags =
  ${cyd_common.build_flags}
  -D ST7789_DRIVER=1
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_OFF=1
